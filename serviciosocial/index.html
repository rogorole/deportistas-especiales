        e.target.tagName, String(e.target.src || e.target.href || ''));

    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);

    let template = JSON.parse(templateEl.textContent);

    // document's manifest; frame srcs carry an about:blank#<uuid> marker

    // its OWN frames — from local text at the root, or text obtained from

    // navigation stays same-origin with its initiator and a deduped page

    // opaque origins (where a blob minted by one document cannot be

    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https

    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded

    // deny-by-default: one request form, one reply form, no error

    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.

      : '*';
    function trustedOrigin(e) {

      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.

    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down

      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }

    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }

    window.addEventListener('message', function (e) {

      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;

        if (ownFrameWindows().indexOf(e.source) < 0) return;

        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'

        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;

        }

            (entry.compressed ? toBase64(finalBytes) : entry.data);

        console.error('Failed to decode asset ' + uuid + ':', err);

    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {

    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

icio\" style=\"position:relative;overflow:hidden;background:linear-gradient(112deg,#3a1d5c 0%,#4a2472 34%,#116d55 78%,#0f8b66 100%);color:#fff;padding:76px 22px 0\">\n    <div style=\"position:absolute;width:520px;height:520px;border-radius:50%;top:-190px;right:-120px;background:radial-gradient(circle,rgba(18,162,116,0.55),transparent 66%);filter:blur(10px);animation:drift 18s ease-in-out infinite;pointer-events:none\"><\u002Fdiv>\n    <div style=\"position:absolute;width:420px;height:420px;border-radius:50%;bottom:-170px;left:-110px;background:radial-gradient(circle,rgba(139,84,196,0.5),transparent 66%);filter:blur(10px);animation:driftAlt 22s ease-in-out infinite;pointer-events:none\"><\u002Fdiv>\n    <div style=\"position:absolute;inset:0;background:repeating-linear-gradient(100deg,rgba(255,255,255,0.05) 0 1px,transparent 1px 76px);pointer-events:none\"><\u002Fdiv>\n    <div style=\"position:absolute;left:0;bottom:60px;width:100%;height:42px;pointer-events:none;overflow:hidden\"><svg sc-camel-view-box=\"0 0 60 60\" style=\"width:42px;height:42px;display:block;animation:roll 15s linear infinite\"><defs><radialGradient id=\"ballBodySS\" cx=\"34%\" cy=\"28%\" r=\"78%\"><stop offset=\"0%\" stop-color=\"#8a5fbb\"><\u002Fstop><stop offset=\"55%\" stop-color=\"#5b2b86\"><\u002Fstop><stop offset=\"100%\" stop-color=\"#2a1544\"><\u002Fstop><\u002FradialGradient><clipPath id=\"ballClipSS\"><circle cx=\"30\" cy=\"30\" r=\"29\"><\u002Fcircle><\u002FclipPath><\u002Fdefs><circle cx=\"30\" cy=\"30\" r=\"29\" fill=\"url(#ballBodySS)\"><\u002Fcircle><g clip-path=\"url(#ballClipSS)\"><ellipse cx=\"20\" cy=\"40\" rx=\"20\" ry=\"7\" fill=\"#3a1d5c\" opacity=\"0.4\" transform=\"rotate(-28 20 40)\"><\u002Fellipse><ellipse cx=\"42\" cy=\"24\" rx=\"16\" ry=\"5\" fill=\"#b98ce0\" opacity=\"0.26\" transform=\"rotate(34 42 24)\"><\u002Fellipse><ellipse cx=\"34\" cy=\"48\" rx=\"13\" ry=\"4\" fill=\"#b98ce0\" opacity=\"0.28\" transform=\"rotate(-14 34 48)\"><\u002Fellipse><ellipse cx=\"19\" cy=\"14\" rx=\"8\" ry=\"5\" fill=\"#fff\" opacity=\"0.22\" transform=\"rotate(-24 19 14)\"><\u002Fellipse><\u002Fg><ellipse cx=\"23\" cy=\"21\" rx=\"4.4\" ry=\"3.7\" fill=\"#180d27\"><\u002Fellipse><ellipse cx=\"36\" cy=\"19\" rx=\"4.4\" ry=\"3.7\" fill=\"#180d27\"><\u002Fellipse><ellipse cx=\"31\" cy=\"43\" rx=\"4.7\" ry=\"3.9\" fill=\"#180d27\"><\u002Fellipse><\u002Fsvg><\u002Fdiv>\n\n    <div style=\"position:relative;max-width:1120px;margin:0 auto;display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:48px;align-items:center;padding-bottom:62px\">\n      <div style=\"animation:riseIn 0.7s ease both\">\n        <div style=\"display:flex;align-items:center;gap:12px\"><span style=\"width:34px;height:1px;background:rgba(255,255,255,0.5);display:block\"><\u002Fspan><span style=\"font-size:11.5px;letter-spacing:0.18em;text-transform:uppercase;color:rgba(255,255,255,0.75)\">Servicio social · León, Guanajuato<\u002Fspan><\u002Fdiv>\n        <h1 style=\"font-family:'DM Serif Display',serif;font-weight:400;font-size:clamp(34px,5.2vw,56px);line-height:1.06;letter-spacing:-0.015em;margin:22px 0 18px;text-wrap:balance\">Cumple tus horas<br><span style=\"color:#7ee0b6\">acompañando atletas<\u002Fspan><\u002Fh1>\n        <p style=\"font-size:17px;line-height:1.65;color:rgba(255,255,255,0.78);max-width:46ch;text-wrap:pretty\">Deportistas Especiales de Guanajuato A.C. recibe estudiantes en dos modalidades: acompañamiento directo en las sesiones de boliche, o proyectos de organización y difusión.<\u002Fp>\n        <div style=\"display:flex;flex-wrap:wrap;gap:12px;margin-top:30px\">\n          <a href=\"#modalidades\" style=\"background:#f6f4f1;color:#2e1b4d;font-weight:500;font-size:15px;padding:14px 24px;border-radius:3px\" style-hover=\"background:#fff;color:#2e1b4d\">Ver las dos modalidades<\u002Fa>\n          <a href=\"#contacto\" style=\"color:#fff;font-size:15px;padding-bottom:4px;border-bottom:1px solid rgba(255,255,255,0.45)\" style-hover=\"color:#7ee0b6;border-bottom-color:#7ee0b6\">Contactar →<\u002Fa>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div style=\"display:flex;flex-direction:column;gap:14px\">\n        <div style=\"background:rgba(255,255,255,0.08);border:1px solid rgba(255,255,255,0.16);border-radius:6px;padding:20px 22px;display:flex;gap:14px;align-items:flex-start\">\n          <svg sc-camel-view-box=\"0 0 24 24\" style=\"width:22px;height:22px;flex-shrink:0;margin-top:2px;stroke:#7ee0b6;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round\"><circle cx=\"12\" cy=\"12\" r=\"9\"><\u002Fcircle><polyline points=\"12 7 12 12 15 15\"><\u002Fpolyline><\u002Fsvg>\n          <div>\n            <p style=\"font-size:10px;letter-spacing:0.12em;text-transform:uppercase;color:rgba(255,255,255,0.55)\">Sesiones<\u002Fp>\n            <p style=\"font-size:16px;font-weight:500;margin-top:4px\">Lunes y miércoles<\u002Fp>\n            <p style=\"font-size:14px;color:rgba(255,255,255,0.68)\">4:30 pm – 7:00 pm<\u002Fp>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"background:rgba(255,255,255,0.08);border:1px solid rgba(255,255,255,0.16);border-radius:6px;padding:20px 22px;display:flex;gap:14px;align-items:flex-start\">\n          <svg sc-camel-view-box=\"0 0 24 24\" style=\"width:22px;height:22px;flex-shrink:0;margin-top:2px;stroke:#7ee0b6;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round\"><path d=\"M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7z\"><\u002Fpath><circle cx=\"12\" cy=\"9\" r=\"2.5\"><\u002Fcircle><\u002Fsvg>\n          <div>\n            <p style=\"font-size:10px;letter-spacing:0.12em;text-transform:uppercase;color:rgba(255,255,255,0.55)\">Sede<\u002Fp>\n            <p style=\"font-size:16px;font-weight:500;margin-top:4px\">Bol-León<\u002Fp>\n            <p style=\"font-size:14px;color:rgba(255,255,255,0.68)\">La Martinica, León de los Aldama<\u002Fp>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"background:rgba(255,255,255,0.08);border:1px solid rgba(255,255,255,0.16);border-radius:6px;padding:20px 22px;display:flex;gap:14px;align-items:flex-start\">\n          <svg sc-camel-view-box=\"0 0 24 24\" style=\"width:22px;height:22px;flex-shrink:0;margin-top:2px;stroke:#7ee0b6;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round\"><path d=\"M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2\"><\u002Fpath><circle cx=\"12\" cy=\"7\" r=\"4\"><\u002Fcircle><\u002Fsvg>\n          <div>\n            <p style=\"font-size:10px;letter-spacing:0.12em;text-transform:uppercase;color:rgba(255,255,255,0.55)\">Te recibe<\u002Fp>\n            <p style=\"font-size:16px;font-weight:500;margin-top:4px\">Claudia Delgado Hinojosa<\u002Fp>\n            <p style=\"font-size:14px;color:rgba(255,255,255,0.68)\">Coordinadora<\u002Fp>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <svg sc-camel-view-box=\"0 0 1440 60\" sc-camel-preserve-aspect-ratio=\"none\" style=\"display:block;width:100%;height:52px;margin-bottom:-2px\">\n      <path d=\"M0,34 C380,2 1060,66 1440,14 L1440,60 L0,60 Z\" fill=\"#f6f4f1\"><\u002Fpath>\n    <\u002Fsvg>\n  <\u002Fheader>\n\n  <main style=\"max-width:1120px;margin:0 auto;padding:0 22px 20px\">\n\n    <section id=\"nosotros\" style=\"padding:70px 0 8px\">\n      <p style=\"font-size:11px;letter-spacing:0.18em;text-transform:uppercase;color:#0b7a5b;font-weight:500\">Quiénes somos<\u002Fp>\n      <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:36px;margin-top:18px;align-items:start\">\n        <h2 style=\"font-family:'DM Serif Display',serif;font-weight:400;font-size:clamp(26px,3.2vw,36px);line-height:1.16;color:#2e1b4d;letter-spacing:-0.01em;text-wrap:balance\">Boliche y actividades lúdicas para personas con discapacidad intelectual<\u002Fh2>\n        <div>\n          <p style=\"font-size:16px;line-height:1.8;color:#4c465a;text-wrap:pretty\">Apoyamos a personas de distintas edades con discapacidad intelectual en su desarrollo a través del boliche y actividades lúdicas. Durante las rondas de juego, el encargado supervisa que cada participante tire en su turno, respete las reglas y no se distraiga, además de reportar cualquier problema con el equipo.<\u002Fp>\n          <p style=\"font-size:16px;line-height:1.8;color:#4c465a;margin-top:14px;text-wrap:pretty\">Al finalizar se realizan actividades recreativas como lotería, dominó, rompecabezas y enceste de balones, fomentando la interacción social en un ambiente inclusivo.<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsection>\n\n    <section id=\"modalidades\" style=\"padding:60px 0 8px\">\n      <p style=\"font-size:11px;letter-spacing:0.18em;text-transform:uppercase;color:#0b7a5b;font-weight:500\">Modalidades de servicio social<\u002Fp>\n      <h2 style=\"font-family:'DM Serif Display',serif;font-weight:400;font-size:clamp(26px,3.2vw,34px);color:#2e1b4d;line-height:1.16;margin-top:12px\">Elige cómo quieres participar<\u002Fh2>\n\n      <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:16px;margin-top:24px;align-items:start\">\n\n        <div style=\"background:#fff;border:1px solid rgba(46,27,77,0.12);border-radius:6px;overflow:hidden\">\n          <div style=\"background:#e6f2ec;padding:24px 26px;display:flex;align-items:center;gap:14px\">\n            <span style=\"width:52px;height:52px;border-radius:6px;background:#5b2b86;color:#fff;display:grid;place-items:center;font-family:'DM Serif Display',serif;font-size:15px;flex-shrink:0\">SS I<\u002Fspan>\n            <div>\n              <p style=\"font-family:'DM Serif Display',serif;font-size:23px;color:#2e1b4d;line-height:1.15\">Acompañamiento<\u002Fp>\n              <p style=\"font-size:13px;color:#6a6377;margin-top:2px\">Apoyo directo a los atletas<\u002Fp>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"padding:24px 26px 28px\">\n            <p style=\"font-size:15px;line-height:1.75;color:#4c465a\">Estarás presente durante las sesiones de boliche apoyando directamente a los participantes.<\u002Fp>\n            <p style=\"font-size:15px;line-height:1.65;color:#2e1b4d;background:#eaf5f0;border-left:3px solid #12a274;padding:14px 16px;border-radius:10px;margin-top:14px;font-style:italic\">Una experiencia humana muy enriquecedora donde se crean amistades y aprendizaje mutuo.<\u002Fp>\n            <div style=\"height:1px;background:rgba(46,27,77,0.10);margin:22px 0 14px\"><\u002Fdiv>\n            <p style=\"font-size:10px;letter-spacing:0.12em;text-transform:uppercase;color:#8f8a9c;font-weight:500\">Actividades incluidas<\u002Fp>\n            <ul style=\"list-style:none;display:flex;flex-direction:column;gap:10px;margin-top:12px\">\n              <li style=\"display:flex;gap:10px;font-size:15px;line-height:1.55;color:#4c465a\"><span style=\"width:7px;height:7px;border-radius:0;background:#12a274;margin-top:7px;flex-shrink:0\"><\u002Fspan>Acompañar a un atleta durante el juego de boliche<\u002Fli>\n              <li style=\"display:flex;gap:10px;font-size:15px;line-height:1.55;color:#4c465a\"><span style=\"width:7px;height:7px;border-radius:0;background:#12a274;margin-top:7px;flex-shrink:0\"><\u002Fspan>Brindar motivación y convivencia en todo momento<\u002Fli>\n              <li style=\"display:flex;gap:10px;font-size:15px;line-height:1.55;color:#4c465a\"><span style=\"width:7px;height:7px;border-radius:0;background:#12a274;margin-top:7px;flex-shrink:0\"><\u002Fspan>Vigilar que tiren en su turno y respeten las reglas<\u002Fli>\n              <li style=\"display:flex;gap:10px;font-size:15px;line-height:1.55;color:#4c465a\"><span style=\"width:7px;height:7px;border-radius:0;background:#12a274;margin-top:7px;flex-shrink:0\"><\u002Fspan>Reportar problemas con el equipo de boliche<\u002Fli>\n              <li style=\"display:flex;gap:10px;font-size:15px;line-height:1.55;color:#4c465a\"><span style=\"width:7px;height:7px;border-radius:0;background:#12a274;margin-top:7px;flex-shrink:0\"><\u002Fspan>Participar en juegos de mesa y actividades recreativas al finalizar<\u002Fli>\n              <li style=\"display:flex;gap:10px;font-size:15px;line-height:1.55;color:#4c465a\"><span style=\"width:7px;height:7px;border-radius:0;background:#12a274;margin-top:7px;flex-shrink:0\"><\u002Fspan>Apoyar durante el torneo anual de boliche<\u002Fli>\n            <\u002Ful>\n            <div style=\"height:1px;background:rgba(46,27,77,0.10);margin:22px 0 14px\"><\u002Fdiv>\n            <p style=\"font-size:10px;letter-spacing:0.12em;text-transform:uppercase;color:#8f8a9c;font-weight:500\">Actividades de la asociación<\u002Fp>\n            <div style=\"display:flex;flex-wrap:wrap;gap:7px;margin-top:12px\">\n              <span style=\"background:#e6f2ec;color:#2e1b4d;font-size:13px;font-weight:500;padding:6px 13px;border-radius:3px\">Boliche<\u002Fspan>\n              <span style=\"background:#e6f2ec;color:#2e1b4d;font-size:13px;font-weight:500;padding:6px 13px;border-radius:3px\">Lotería<\u002Fspan>\n              <span style=\"background:#e6f2ec;color:#2e1b4d;font-size:13px;font-weight:500;padding:6px 13px;border-radius:3px\">Dominó<\u002Fspan>\n              <span style=\"background:#e6f2ec;color:#2e1b4d;font-size:13px;font-weight:500;padding:6px 13px;border-radius:3px\">Rompecabezas<\u002Fspan>\n              <span style=\"background:#e6f2ec;color:#2e1b4d;font-size:13px;font-weight:500;padding:6px 13px;border-radius:3px\">Enceste de balones<\u002Fspan>\n              <span style=\"background:#e6f2ec;color:#2e1b4d;font-size:13px;font-weight:500;padding:6px 13px;border-radius:3px\">Juegos de mesa<\u002Fspan>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <div style=\"background:#fff;border:1px solid rgba(91,43,134,0.32);border-radius:6px;overflow:hidden\">\n          <div style=\"background:#efeaf6;padding:24px 26px;display:flex;align-items:center;gap:14px\">\n            <span style=\"width:52px;height:52px;border-radius:6px;background:#5b2b86;color:#fff;display:grid;place-items:center;font-family:'DM Serif Display',serif;font-size:15px;flex-shrink:0\">SS II<\u002Fspan>\n            <div>\n              <p style=\"font-family:'DM Serif Display',serif;font-size:23px;color:#2e1b4d;line-height:1.15\">Proyectos y apoyo<\u002Fp>\n              <p style=\"font-size:13px;color:#6b3a9e;margin-top:2px\">Proyectos ligados a tu carrera<\u002Fp>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"padding:24px 26px 28px\">\n            <p style=\"font-size:15px;line-height:1.75;color:#4c465a\">Aquí tienes mucha más libertad para proponer tu propio proyecto: el SS II debe relacionarse con tu carrera, así que lo diseñas desde tu área de estudio y lo desarrollas junto con la asociación.<\u002Fp>\n            <p style=\"font-size:15px;line-height:1.65;color:#4c465a;background:#efeaf6;border-left:3px solid #8b54c4;padding:14px 16px;border-radius:3px;margin-top:14px;font-style:italic\">Enfocado en organización, creatividad e impacto social.<\u002Fp>\n            <div style=\"height:1px;background:rgba(46,27,77,0.10);margin:22px 0 14px\"><\u002Fdiv>\n            <p style=\"font-size:10px;letter-spacing:0.12em;text-transform:uppercase;color:#8f8a9c;font-weight:500\">Ejemplos de proyectos<\u002Fp>\n            <ul style=\"list-style:none;display:flex;flex-direction:column;gap:10px;margin-top:12px\">\n              <li style=\"display:flex;gap:10px;font-size:15px;line-height:1.55;color:#4c465a\"><span style=\"width:7px;height:7px;border-radius:0;background:#8b54c4;margin-top:7px;flex-shrink:0\"><\u002Fspan>Manejo de redes sociales<\u002Fli>\n              <li style=\"display:flex;gap:10px;font-size:15px;line-height:1.55;color:#4c465a\"><span style=\"width:7px;height:7px;border-radius:0;background:#8b54c4;margin-top:7px;flex-shrink:0\"><\u002Fspan>Diseño de material de difusión<\u002Fli>\n              <li style=\"display:flex;gap:10px;font-size:1  {\n  state = { pinFalling: false };\n  componentWillUnmount() { clearTimeout(this._pinTimer); }\n  knockPin = () => {\n    if (this.state.pinFalling) return;\n    this.setState({ pinFalling: true });\n    this._pinTimer = setTimeout(() => this.setState({ pinFalling: false }), 1400);\n  };\n  renderVals() {\n    const falling = this.state.pinFalling;\n    return {\n      knockPin: this.knockPin,\n      pinTransform: falling ? 'rotate(-76deg)' : 'rotate(0deg)',\n      pinAnim: falling ? 'none' : 'sway 6s ease-in-out infinite'\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
