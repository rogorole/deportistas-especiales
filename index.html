document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

         <span style=\"font-size:11.5px;letter-spacing:0.18em;text-transform:uppercase;color:rgba(255,255,255,0.75)\">Asociación Civil · León, Guanajuato<\u002Fspan>\n        <\u002Fdiv>\n        <h1 style=\"font-family:'DM Serif Display',serif;font-weight:400;font-size:clamp(34px,5.2vw,58px);line-height:1.06;letter-spacing:-0.015em;margin:20px 0 18px;text-wrap:balance\">El deporte como<br><span style=\"color:#7ee0b6\">punto de encuentro<\u002Fspan><\u002Fh1>\n        <p style=\"font-size:17px;line-height:1.7;color:rgba(255,255,255,0.8);max-width:44ch;text-wrap:pretty\">Promovemos la inclusión, el desarrollo integral y la calidad de vida de las personas con discapacidad intelectual a través del boliche y la convivencia.<\u002Fp>\n        <div style=\"display:flex;flex-wrap:wrap;gap:26px;align-items:center;margin-top:32px\">\n          <a href=\"#visita\" style=\"background:#f6f4f1;color:#2e1b4d;font-weight:500;font-size:15px;padding:15px 26px;border-radius:3px;transition:transform .2s,background .2s\" style-hover=\"background:#fff;color:#2e1b4d;transform:translateY(-2px)\">Conócenos en persona<\u002Fa>\n          <a href=\"#apoyar\" style=\"color:#fff;font-size:15px;padding-bottom:4px;border-bottom:1px solid rgba(255,255,255,0.45)\" style-hover=\"color:#7ee0b6;border-bottom-color:#7ee0b6\">Cómo apoyar →<\u002Fa>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div style=\"display:flex;flex-direction:column;align-items:center;gap:28px\">\n        <div style=\"width:min(460px,100%)\" data-comment-anchor=\"1a8c0fe392-div\">\n          <sc-if value=\"{{ logoOk }}\" hint-placeholder-val=\"{{ true }}\">\n            <img src=\"bf1c0c9e-ea59-469f-955e-d8297d7d0b7f\" alt=\"Logo Amigos Especiales de Boliche Guanajuato A.C.\" sc-camel-on-error=\"{{ onLogoError }}\" style=\"width:100%;height:auto;display:block;filter:drop-shadow(0 10px 26px rgba(0,0,0,0.35))\">\n          <\u002Fsc-if>\n          <sc-if value=\"{{ logoMissing }}\" hint-placeholder-val=\"{{ false }}\">\n            <span style=\"font-family:'DM Serif Display',serif;font-size:28px;line-height:1.25;text-align:center;color:#fff;display:block;padding:14px 0\">Amigos Especiales<br>de Boliche Gto. A.C.<\u002Fspan>\n          <\u002Fsc-if>\n        <\u002Fdiv>\n        <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:1px;width:min(420px,100%);background:rgba(255,255,255,0.16)\">\n          <div style=\"background:rgba(58,29,92,0.28);padding:16px 18px\">\n            <p style=\"font-size:10px;letter-spacing:0.14em;text-transform:uppercase;color:rgba(255,255,255,0.6)\">Sesiones<\u002Fp>\n            <p style=\"font-size:15px;font-weight:500;margin-top:5px\">Lunes y miércoles<\u002Fp>\n            <p style=\"font-size:13px;color:rgba(255,255,255,0.68)\">4:30 – 7:00 pm<\u002Fp>\n          <\u002Fdiv>\n          <div style=\"background:rgba(58,29,92,0.28);padding:16px 18px\">\n            <p style=\"font-size:10px;letter-spacing:0.14em;text-transform:uppercase;color:rgba(255,255,255,0.6)\">Sede<\u002Fp>\n            <p style=\"font-size:15px;font-weight:500;margin-top:5px\">Bol-León<\u002Fp>\n            <p style=\"font-size:13px;color:rgba(255,255,255,0.68)\">La Martinica, León<\u002Fp>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <svg sc-camel-view-box=\"0 0 1440 60\" sc-camel-preserve-aspect-ratio=\"none\" style=\"display:block;width:100%;height:52px;margin-bottom:-2px\">\n      <path d=\"M0,34 C380,2 1060,66 1440,14 L1440,60 L0,60 Z\" fill=\"#f6f4f1\"><\u002Fpath>\n    <\u002Fsvg>\n  <\u002Fheader>\n\n  <main style=\"max-width:1120px;margin:0 auto;padding:0 22px 20px\">\n\n    <section id=\"nosotros\" style=\"padding:74px 0 8px\">\n      <div style=\"display:flex;align-items:center;gap:12px\">\n        <span style=\"width:26px;height:1px;background:#12a274;display:block\"><\u002Fspan>\n        <p style=\"font-size:11.5px;letter-spacing:0.18em;text-transform:uppercase;color:#0b7a5b;font-weight:500\">Quiénes somos<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:40px;margin-top:20px;align-items:start\">\n        <div>\n          <h2 style=\"font-family:'DM Serif Display',serif;font-weight:400;font-size:clamp(26px,3.2vw,36px);line-height:1.16;color:#2e1b4d;letter-spacing:-0.01em;text-wrap:balance\">Una comunidad donde cada participante es reconocido como atleta<\u002Fh2>\n          <p style=\"font-size:16px;line-height:1.8;color:#4c465a;margin-top:18px;text-wrap:pretty\">Somos una asociación civil de León, Guanajuato, dedicada a abrir espacios reales de inclusión para personas con discapacidad intelectual a través del deporte. El boliche es nuestro punto de encuentro: un lugar donde cada participante es reconocido como atleta, como compañero y como parte de una comunidad.<\u002Fp>\n          <p style=\"font-size:16px;line-height:1.8;color:#4c465a;margin-top:14px;text-wrap:pretty\">En cada sesión acompañamos a los atletas durante sus rondas de juego —cuidando turnos, reglas y, sobre todo, animándolos en cada tiro— y al terminar convivimos con actividades lúdicas como lotería, dominó, rompecabezas y enceste de balones. Más allá del juego, buscamos que las familias encuentren una red de apoyo, respiro y pertenencia.<\u002Fp>\n        <\u002Fdiv>\n        <div style=\"display:flex;flex-direction:column;gap:14px\">\n          <div style=\"background:#fff;border:1px solid rgba(46,27,77,0.09);border-radius:6px;padding:28px;border-left:3px solid #12a274\">\n            <p style=\"font-size:11px;letter-spacing:0.16em;text-transform:uppercase;color:#0b7a5b;font-weight:500\">Misión<\u002Fp>\n            <p style=\"font-size:15px;line-height:1.75;color:#4c465a;margin-top:10px\">Promover la inclusión, el desarrollo integral y la calidad de vida de personas con discapacidad a través del deporte, brindando oportunidades de entrenamiento, competencia y convivencia en un entorno seguro, respetuoso y motivador.<\u002Fp>\n          <\u002Fdiv>\n          <div style=\"background:#3a1d5c;border-radius:6px;padding:28px;color:#fff;border-left:3px solid #8b54c4\">\n            <p style=\"font-size:11px;letter-spacing:0.16em;text-transform:uppercase;color:#c9aee8;font-weight:500\">Visión<\u002Fp>\n            <p style=\"font-size:15px;line-height:1.75;color:rgba(255,255,255,0.85);margin-top:10px\">Ser una asociación referente a nivel local y nacional en la formación y promoción de deportistas especiales, reconocida por fomentar la inclusión social, el respeto a la diversidad y el talento deportivo sin barreras.<\u002Fp>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsection>\n\n    <section style=\"padding:66px 0 8px\">\n      <div style=\"display:flex;align-items:center;gap:12px\">\n        <span style=\"width:26px;height:1px;background:#12a274;display:block\"><\u002Fspan>\n        <p style=\"font-size:11.5px;letter-spacing:0.18em;text-transform:uppercase;color:#0b7a5b;font-weight:500\">Nuestros valores<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:1px;margin-top:22px;background:rgba(46,27,77,0.10);border:1px solid rgba(46,27,77,0.10);border-radius:6px;overflow:hidden\">\n        <div style=\"background:#fff;padding:26px 24px\">\n          <span style=\"font-family:'DM Serif Display',serif;font-size:21px;color:#8b54c4\">01<\u002Fspan>\n          <p style=\"font-size:16px;font-weight:500;color:#2e1b4d;margin-top:8px\">Inclusión<\u002Fp>\n          <p style=\"font-size:14px;line-height:1.65;color:#6a6377;margin-top:6px\">Todas las personas tienen derecho a participar y desarrollarse en el deporte.<\u002Fp>\n        <\u002Fdiv>\n        <div style=\"background:#fff;padding:26px 24px\">\n          <span style=\"font-family:'DM Serif Display',serif;font-size:21px;color:#8b54c4\">02<\u002Fspan>\n          <p style=\"font-size:16px;font-weight:500;color:#2e1b4d;margin-top:8px\">Respeto<\u002Fp>\n          <p style=\"font-size:14px;line-height:1.65;color:#6a6377;margin-top:6px\">Valoramos la dignidad, las capacidades y el esfuerzo de cada deportista.<\u002Fp>\n        <\u002Fdiv>\n        <div style=\"background:#fff;padding:26px 24px\">\n          <span style=\"font-family:'DM Serif Display',serif;font-size:21px;color:#8b54c4\">03<\u002Fspan>\n          <p style=\"font-size:16px;font-weight:500;color:#2e1b4d;margin-top:8px\">Igualdad de oportunidades<\u002Fp>\n          <p style=\"font-size:14px;line-height:1.65;color:#6a6377;margin-top:6px\">Impulsamos el acceso equitativo a las actividades deportivas.<\u002Fp>\n        <\u002Fdiv>\n        <div style=\"background:#fff;padding:26px 24px\">\n          <span style=\"font-family:'DM Serif Display',serif;font-size:21px;color:#8b54c4\">04<\u002Fspan>\n          <p style=\"font-size:16px;font-weight:500;color:#2e1b4d;margin-top:8px\">Compromiso social<\u002Fp>\n          <p style=\"font-size:14px;line-height:1.65;color:#6a6377;margin-top:6px\">Trabajamos por una sociedad más justa y empática.<\u002Fp>\n        <\u002Fdiv>\n        <div style=\"background:#fff;padding:26px 24px\">\n          <span style=\"font-family:'DM Serif Display',serif;font-size:21px;color:#8b54c4\">05<\u002Fspan>\n          <p style=\"font-size:16px;font-weight:500;color:#2e1b4d;margin-top:8px\">Superación<\u002Fp>\n          <p style=\"font-size:14px;line-height:1.65;color:#6a6377;margin-top:6px\">Fomentamos la confianza, el esfuerzo y el crecimiento personal.<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsection>\n\n    <section id=\"actividades\" style=\"padding:66px 0 8px\">\n      <div style=\"display:flex;align-items:center;gap:12px\">\n        <span style=\"width:26px;height:1px;background:#12a274;display:block\"><\u002Fspan>\n        <p style=\"font-size:11.5px;letter-spacing:0.18em;text-transform:uppercase;color:#0b7a5b;font-weight:500\">Qué hacemos<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));gap:16px;margin-top:22px;align-items:start\">\n        <div style=\"background:#fff;border:1px solid rgba(46,27,77,0.09);border-radius:6px;padding:30px\">\n          <h3 style=\"font-family:'DM Serif Display',serif;font-weight:400;font-size:25px;color:#2e1b4d\">Actividades del año<\u002Fh3>\n          <p style=\"font-size:15px;line-height:1.75;color:#4c465a;margin-top:10px\">Nuestra actividad principal es el boliche, complementada con juegos y dinámicas que fortalecen la convivencia. A lo largo del año organizamos y participamos en:<\u002Fp>\n          <ul style=\"list-style:none;display:flex;flex-direction:column;gap:11px;margin-top:16px\">\n            <li style=\"display:flex;gap:12px;font-size:15px;line-height:1.55;color:#4c465a\"><span style=\"width:6px;height:6px;background:#12a274;margin-top:8px;flex-shrink:0\"><\u002Fspan>Torneos deportivos inclusivos y adaptados.<\u002Fli>\n            <li style=\"display:flex;gap:12px;font-size:15px;line-height:1.55;color:#4c465a\"><span style=\"width:6px;height:6px;background:#12a274;margin-top:8px;flex-shrink:0\"><\u002Fspan>Exhibiciones y demostraciones deportivas.<\u002Fli>\n            <li style=\"display:flex;gap:12px;font-size:15px;line-height:1.55;color:#4c465a\"><span style=\"width:6px;height:6px;background:#12a274;margin-top:8px;flex-shrink:0\"><\u002Fspan>Jornadas recreativas y de convivencia familiar.<\u002Fli>\n            <li style=\"display:flex;gap:12px;font-size:15px;line-height:1.55;color:#4c465a\"><span style=\"width:6px;height:6px;background:#12a274;margin-top:8px;flex-shrink:0\"><\u002Fspan>Competencias locales, estatales y nacionales.<\u002Fli>\n          <\u002Ful>\n          <div style=\"height:1px;background:rgba(46,27,77,0.09);margin:24px 0 16px\"><\u002Fdiv>\n          <p style=\"font-size:10px;letter-spacing:0.14em;text-transform:uppercase;color:#8f8a9c;font-weight:500\">En cada sesión<\u002Fp>\n          <div style=\"display:flex;flex-wrap:wrap;gap:8px;margin-top:12px\">\n            <span style=\"border:1px solid rgba(46,27,77,0.16);color:#4c465a;font-size:13px;padding:6px 12px;border-radius:3px\">Boliche<\u002Fspan>\n            <span style=\"border:1px solid rgba(46,27,77,0.16);color:#4c465a;font-size:13px;padding:6px 12px;border-radius:3px\">Lotería<\u002Fspan>\n            <span style=\"border:1px solid rgba(46,27,77,0.16);color:#4c465a;font-size:13px;padding:6px 12px;border-radius:3px\">Dominó<\u002Fspan>\n            <span style=\"border:1px solid rgba(46,27,77,0.16);color:#4c465a;font-size:13px;padding:6px 12px;border-radius:3px\">Rompecabezas<\u002Fspan>\n            <span style=\"border:1px solid rgba(46,27,77,0.16);color:#4c465a;font-size:13px;padding:6px 12px;border-radius:3px\">Enceste de balones<\u002Fspan>\n            <span style=\"border:1px solid rgba(46,27,77,0.16);color:#4c465a;font-size:13px;padding:6px 12px;border-radius:3px\">Juegos de mesa<\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <div style=\"display:flex;flex-direction:column;gap:16px\">\n          <div style=\"background:#fff;border:1px solid rgba(46,27,77,0.09);border-radius:6px;padding:30px\">\n            <h3 style=\"font-family:'DM Serif Display',serif;font-weight:400;font-size:25px;color:#2e1b4d\">Objetivos<\u002Fh3>\n            <ul style=\"list-style:none;display:flex;flex-direction:column;gap:11px;margin-top:14px\">\n              <li style=\"display:flex;gap:12px;font-size:15px;line-height:1.55;color:#4c465a\"><span style=\"width:6px;height:6px;background:#12a274;margin-top:8px;flex-shrink:0\"><\u002Fspan>Organizar entrenamientos y competencias inclusivas.<\u002Fli>\n              <li style=\"display:flex;gap:12px;font-size:15px;line-height:1.55;color:#4c465a\"><span style=\"width:6px;height:6px;background:#12a274;margin-top:8px;flex-shrink:0\"><\u002Fspan>Impulsar la integración social mediante el deporte.<\u002Fli>\n              <li style=\"display:flex;gap:12px;font-size:15px;line-height:1.55;color:#4c465a\"><span style=\"width:6px;height:6px;background:#12a274;margin-top:8px;flex-shrink:0\"><\u002Fspan>Sensibilizar a la comunidad sobre la inclusión y el respeto a la diversidad.<\u002Fli>\n              <li style=\"display:flex;gap:12px;font-size:15px;line-height:1.55;color:#4c465a\"><span style=\"width:6px;height:6px;background:#12a274;margin-top:8px;flex-shrink:0\"><\u002Fspan>Establecer alianzas con instituciones educativas, deportivas y sociales.<\u002Fli>\n            <\u002Ful>\n          <\u002Fdiv>\n          <div style=\"background:#efeaf6;border:1px solid rgba(91,43,134,0.14);border-radius:6px;padding:30px\">\n            <h3 style=\"font-family:'DM Serif Display',serif;font-weight:400;font-size:25px;color:#2e1b4d\">¿A quién va dirigido?<\u002Fh3>\n            <p style=\"font-size:15px;line-height:1.75;color:#4c465a;margin-top:10px\">Acompañamos a personas de distintas edades con discapacidad intelectual y a sus familias. Además, trabajamos de la mano de:<\u002Fp>\n            <div style=\"display:flex;flex-wrap:wrap;gap:8px;margin-top:14px\">\n              <span style=\"background:#fff;color:#3a1d5c;font-size:13px;padding:6px 12px;border-radius:3px\">Familias y cuidadores<\u002Fspan>\n              <span style=\"background:#fff;color:#3a1d5c;font-size:13px;padding:6px 12px;border-radius:3px\">Entrenadores<\u002Fspan>\n              <span style=\"background:#fff;color:#3a1d5c;font-size:13px;padding:6px 12px;border-radius:3px\">Instituciones educativas<\u002Fspan>\n              <span style=\"background:#fff;color:#3a1d5c;font-size:13px;padding:6px 12px;border-radius:3px\">Organizaciones y fundaciones<\u002Fspan>\n              <span style=\"background:#fff;color:#3a1d5c;font-size:13px;padding:6px 12px;border-radius:3px\">Comunidad interesada<\u002Fspan>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsection>\n\n    <section id=\"visita\" style=\"padding:66px 0 8px\">\n      <div style=\"display:flex;align-items:center;gap:12px\">\n        <span style=\"width:26px;height:1px;background:#12a274;display:block\"><\u002Fspan>\n        <p style=\"font-size:11.5px;letter-spacing:0.18em;text-transform:uppercase;color:#0b7a5b;font-weight:500\">Visítanos<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(270px,1fr));gap:16px;margin-top:22px;align-items:start\">\n        <div style=\"background:#fff;border:1px solid rgba(46,27,77,0.09);border-radius:6px;padding:28px\">\n          <svg sc-camel-view-box=\"0 0 24 24\" style=\"width:24px;height:24px;stroke:#5b2b86;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round\"><circle cx=\"12\" cy=\"12\" r=\"9\"><\u002Fcircle><polyline points=\"12 7 12 12 15 15\"><\u002Fpolyline><\u002Fsvg>\n          <p style=\"font-size:11px;letter-spacing:0.16em;text-transform:uppercase;color:#8f8a9c;font-weight:500;margin-top:18px\">Horarios<\u002Fp>\n          <p style=\"font-size:18px;font-weight:500;color:#221733;margin-top:6px\">Lunes y miércoles<\u002Fp>\n          <p style=\"font-size:15px;color:#6a6377;margin-top:2px\">4:30 pm – 7:00 pm<\u002Fp>\n        <\u002Fdiv>\n        <div style=\"background:#fff;border:1px solid rgba(46,27,77,0.09);border-radius:6px;padding:28px\">\n          <svg sc-camel-view-box=\"0 0 24 24\" style=\"width:24px;height:24px;stroke:#5b2b86;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round\"><path d=\"M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7z\"><\u002Fpath><circle cx=\"12\" cy=\"9\" r=\"2.5\"><\u002Fcircle><\u002Fsvg>\n          <p style=\"font-size:11px;letter-spacing:0.16em;text-transform:uppercase;color:#8f8a9c;font-weight:500;margin-top:18px\">Ubicación<\u002Fp>\n          <p style=\"font-size:16px;font-weight:500;color:#221733;margin-top:6px;line-height:1.45\">Bol-León · Blvr. Mariano Escobedo Pte. 2719<\u002Fp>\n          <p style=\"font-size:14px;color:#6a6377;ma t(auto-fit,minmax(280px,1fr));gap:36px;align-items:start\">\n        <div>\n          <div style=\"display:flex;align-items:center;gap:12px\">\n            <span style=\"width:26px;height:1px;background:#8b54c4;display:block\"><\u002Fspan>\n            <p style=\"font-size:11.5px;letter-spacing:0.18em;text-transform:uppercase;color:#6b3a9e;font-weight:500\">Cómo puedes apoyar<\u002Fp>\n          <\u002Fdiv>\n          <h2 style=\"font-family:'DM Serif Display',serif;font-weight:400;font-size:clamp(26px,3.2vw,34px);color:#2e1b4d;line-height:1.15;margin-top:14px;text-wrap:balance\">Tu apoyo abre una pista más<\u002Fh2>\n          <p style=\"font-size:15px;line-height:1.75;color:#4c465a;margin-top:12px;max-width:46ch\">Con tu ayuda, más personas con discapacidad intelectual tienen un espacio para jugar, competir y convivir.<\u002Fp>\n        <\u002Fdiv>\n        <ul style=\"list-style:none;display:flex;flex-direction:column;gap:13px\">\n          <li style=\"display:flex;gap:12px;font-size:15px;line-height:1.6;color:#453b57\"><span style=\"width:6px;height:6px;background:#8b54c4;margin-top:9px;flex-shrink:0\"><\u002Fspan>Voluntariado y acompañamiento durante las sesiones.<\u002Fli>\n          <li style=\"display:flex;gap:12px;font-size:15px;line-height:1.6;color:#453b57\"><span style=\"width:6px;height:6px;background:#8b54c4;margin-top:9px;flex-shrink:0\"><\u002Fspan>Donativos de equipo, materiales o apoyo económico.<\u002Fli>\n          <li style=\"display:flex;gap:12px;font-size:15px;line-height:1.6;color:#453b57\"><span style=\"width:6px;height:6px;background:#8b54c4;margin-top:9px;flex-shrink:0\"><\u002Fspan>Patrocinios y alianzas institucionales.<\u002Fli>\n          <li style=\"display:flex;gap:12px;font-size:15px;line-height:1.6;color:#453b57\"><span style=\"width:6px;height:6px;background:#8b54c4;margin-top:9px;flex-shrink:0\"><\u002Fspan>Difusión de nuestra causa en tu comunidad.<\u002Fli>\n        <\u002Ful>\n      <\u002Fdiv>\n    <\u002Fsection>\n    <\u002
